<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <header class="dashboard-header">
        <div>
            <h1>User Management System</h1>
            <p>Admin Dashboard</p>
        </div>

        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>
    </header>


    <main class="dashboard-container">

        <section class="welcome-section">
            <h2>Dashboard</h2>
            <p>Manage users through your Django REST API.</p>
        </section>


        <section class="stats-container">

            <div class="stat-card">
                <h3>Total Users</h3>
                <p id="totalUsers">0</p>
            </div>

            <div class="stat-card">
                <h3>API Status</h3>
                <p id="apiStatus">Checking...</p>
            </div>

        </section>

         <section class="add-user-section">

    <h2>Add New User</h2>

    <form id="addUserForm">

        <div class="form-row">

            <div class="input-group">
                <label for="newName">Name</label>
                <input
                    type="text"
                    id="newName"
                    placeholder="Enter name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="newEmail">Email</label>
                <input
                    type="email"
                    id="newEmail"
                    placeholder="Enter email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="newRole">Role</label>
                <select id="newRole" required>
                    <option value="student">Student</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

        </div>

        <button type="submit" class="add-user-btn">
            Add User
        </button>

    </form>

    <p id="addUserMessage" class="message"></p>

</section>
        <section class="edit-user-section" id="editUserSection" style="display: none;">

    <h2>Edit User</h2>

    <form id="editUserForm">

        <input type="hidden" id="editUserId">

        <div class="form-row">

            <div class="input-group">
                <label for="editName">Name</label>

                <input
                    type="text"
                    id="editName"
                    required
                >
            </div>

            <div class="input-group">
                <label for="editEmail">Email</label>

                <input
                    type="email"
                    id="editEmail"
                    required
                >
            </div>

            <div class="input-group">
                <label for="editRole">Role</label>

                <select id="editRole" required>
                    <option value="student">Student</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

        </div>

        <button type="submit" class="update-user-btn">
            Update User
        </button>

        <button
            type="button"
            class="cancel-edit-btn"
            id="cancelEditBtn"
        >
            Cancel
        </button>

    </form>

    <p id="editUserMessage" class="message"></p>

</section>
        <section class="users-section">

            <div class="section-header">
                <h2>Users</h2>

                <button id="refreshBtn" class="refresh-btn">
                    Refresh Users
                </button>
            </div>

            <p id="message" class="message"></p>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Created At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="5">
                                Loading users...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="js/dashboard.js"></script>

</body>
</html>
